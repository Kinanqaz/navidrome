name: Quality checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint Go code
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 3m

      - name: Test Go code
        run: go test -tags netgo,sqlite_fts5 ./...

  ui:
    name: UI lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Check UI formatting
        run: npm run check-formatting

      - name: Lint UI code
        run: npm run lint

      - name: Type-check UI code
        run: npm run type-check

      - name: Test UI code
        run: npm test

      - name: Build production UI
        run: npm run build
